name: CI

# Quality gate: corre en cada push/PR. El deploy lo hace la plataforma de
# hosting (Netlify / Cloudflare Pages) por su integración con git; aquí solo
# verificamos que el código pasa lint, tipos y build antes de mezclar/desplegar.
on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint + format (biome)
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (SSG)
        run: pnpm generate
